<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your verification code — {{app_name}}</title>
</head>
<body style="margin:0;padding:0;background-color:#fcfcf8;font-family:'Public Sans',Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fcfcf8;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;background-color:#ffffff;border:1px solid #e5e7eb;">
          <tr>
            <td style="background-color:#d72a28;padding:24px 32px;text-align:center;">
              <span style="color:#ffffff;font-family:'Almendra',Georgia,serif;font-size:22px;font-weight:700;">Island Rhymes T&amp;T</span>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px;text-align:center;">
              <h1 style="margin:0 0 16px 0;color:#1b1c1d;font-family:'Almendra',Georgia,serif;font-size:28px;line-height:1.2;">Your verification code</h1>
              <p style="margin:0 0 24px 0;color:#1b1c1d;font-size:16px;line-height:1.6;">Hi {{first_name}}, use this code to verify your email and start reading with {{app_name}}.</p>
              <p style="margin:0 0 24px 0;color:#d72a28;font-family:'Almendra',Georgia,serif;font-size:40px;font-weight:700;letter-spacing:8px;">{{otp_code}}</p>
              <p style="margin:0;color:#1b1c1d;font-size:14px;line-height:1.6;">If you didn't create an account, you can ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px;border-top:1px solid #e5e7eb;background-color:#fcfcf8;">
              <p style="margin:0;color:#d72a28;font-size:13px;line-height:1.5;text-align:center;">Island Rhymes T&amp;T</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
